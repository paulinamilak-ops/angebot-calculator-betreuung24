# /etc/nginx/sites-available/calculator
# calculator.betreuung24.de — Static App + Node.js API + Ollama AI

server {
    listen 80;
    server_name calculator.betreuung24.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name calculator.betreuung24.de;

    ssl_certificate     /etc/letsencrypt/live/calculator.betreuung24.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calculator.betreuung24.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Fotoğraf yükleme için limit
    client_max_body_size 25M;

    root /var/www/calculator;
    index index.html;

    # ── Statik dosyalar (HTML app) ──────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Node.js API — Auth ──────────────────────────────────────
    location /auth/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Node.js API — Kullanıcı yönetimi ───────────────────────
    location /users {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Node.js API — CV kayıt/listeleme ───────────────────────
    location /cv/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Node.js API — Güvenlik logu ────────────────────────────
    location /security-log {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Node.js API — AI üretim (kuyruk sistemi) ───────────────
    # NOT: Eski /ai/ → Ollama direkt bağlantısı KALKTI
    # Artık Node.js sunucu Ollama'yı içten çağırıyor
    location /ai/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 180s;
    }

    # ── Health check ────────────────────────────────────────────
    location /health {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 10s;
    }
}
